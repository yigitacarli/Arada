<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300&display=swap">
  <style>
    body { margin: 0; }
    a { color: #F1EBDE; } a:hover { color: #FFFFFF; }
    .text { font-family: "Newsreader", ui-serif, Georgia, serif; }
    .caps { letter-spacing: 0.24em; text-transform: uppercase; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #1B1915;">

  <div style="position: absolute; inset: 0; background: radial-gradient(140% 100% at 44% 46%, #24211C 0%, #1C1A16 58%, #141310 100%);"></div>

  <!-- ışık yolun üçte birinde -->
  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 390px; height: 844px;">
    <defs>
      <filter id="soft-r1" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="26"></feGaussianBlur>
      </filter>
      <filter id="soft-r2" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8"></feGaussianBlur>
      </filter>
      <linearGradient id="beam-r" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
        <stop offset="0" stop-color="#D9C79B" stop-opacity="0.52"></stop>
        <stop offset="0.55" stop-color="#C0AC80" stop-opacity="0.34"></stop>
        <stop offset="1" stop-color="#8E7E5C" stop-opacity="0.10"></stop>
      </linearGradient>
    </defs>

    <polygon points="64,286 262,242 296,568 98,626" fill="url(#beam-r)" filter="url(#soft-r1)"></polygon>
    <polygon points="168,262 179,260 208,594 197,597" fill="#15130F" opacity="0.42" filter="url(#soft-r2)"></polygon>
    <polygon points="60,414 288,364 291,382 63,432" fill="#15130F" opacity="0.34" filter="url(#soft-r2)"></polygon>
  </svg>

  <svg style="position: absolute; inset: 0; width: 390px; height: 844px; opacity: 0.11; mix-blend-mode: overlay;">
    <filter id="grain-r">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="390" height="844" filter="url(#grain-r)"></rect>
  </svg>

  <!-- ışığın varması gereken kenar: neredeyse görünmez bir iz -->
  <div style="position: absolute; right: 30px; top: 236px; bottom: 214px; width: 1px; background: rgba(217,199,155,0.16);"></div>

  <div class="text caps" style="position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; font-size: 9.5px; color: rgba(217,199,155,0.20);">Telefonu bırak</div>

</div>
</x-dc>
</body>
</html>
