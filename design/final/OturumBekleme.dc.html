<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,300&display=swap">
  <style>
    body { margin: 0; }
    a { color: #F1EBDE; } a:hover { color: #FFFFFF; }
    .disp { font-family: "Instrument Serif", ui-serif, Georgia, serif; }
    .text { font-family: "Newsreader", ui-serif, Georgia, serif; }
    .caps { letter-spacing: 0.2em; text-transform: uppercase; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #24211C;">

  <div style="position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 34%, #2C2823 0%, #221F1A 52%, #191713 100%);"></div>

  <!-- ışık henüz girmedi: pencerenin yeri belli, içi sönük -->
  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 390px; height: 844px;">
    <defs>
      <filter id="soft-w" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="20"></feGaussianBlur>
      </filter>
    </defs>
    <polygon points="52,250 338,186 372,506 86,586" fill="#6E6555" opacity="0.10" filter="url(#soft-w)"></polygon>
  </svg>

  <svg style="position: absolute; inset: 0; width: 390px; height: 844px; opacity: 0.10; mix-blend-mode: overlay;">
    <filter id="grain-w">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="390" height="844" filter="url(#grain-w)"></rect>
  </svg>

  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 62px 34px 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;">

    <svg viewBox="0 0 40 40" style="width: 27px; height: 27px; display: block; margin-bottom: 34px;">
      <rect x="0.9" y="0.9" width="38.2" height="38.2" fill="none" stroke="#6E6555" stroke-width="1.3"></rect>
      <path d="M 0.9 26 L 39.1 12" fill="none" stroke="#6E6555" stroke-width="1.3" opacity="0.55"></path>
    </svg>

    <div class="disp" style="font-size: 40px; line-height: 1.14; letter-spacing: -0.015em; color: #E8E1D2; text-align: center;">Telefonu<br>yüzüstü çevir</div>

    <div class="text" style="font-size: 16.5px; font-weight: 300; line-height: 1.6; color: #8A8072; text-align: center; margin-top: 22px; max-width: 26ch;">Işık pencereden girdiğinde sayaç başlar. Telefonu eline alırsan durur.</div>
  </div>

  <div class="text caps" style="position: absolute; left: 0; right: 0; bottom: 46px; text-align: center; font-size: 10px; color: #4B463C;">Şimdi değil</div>

</div>
</x-dc>
</body>
</html>
