name: Arada

options:
  bundleIdPrefix: app.arada
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

targets:
  Arada:
    type: application
    platform: iOS
    sources:
      - path: Arada
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arada.ios
        PRODUCT_NAME: Arada
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Supporting/Arada-Info.plist
      properties:
        CFBundleDisplayName: Arada
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Newsreader.ttf
          - Newsreader-Italic.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        NSMotionUsageDescription: >-
          Oturum sayacı yalnızca telefon yüzüstü dururken ilerler. Bunu anlayabilmek
          için hareket sensörünü kullanıyoruz; hiçbir veri cihazdan çıkmaz.
