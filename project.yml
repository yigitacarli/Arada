name: Arada

options:
  bundleIdPrefix: app.arada
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

targets:
  Arada:
    type: application
    platform: iOS
    sources:
      - path: Arada
      - path: Shared
    dependencies:
      - target: AradaDeviceActivityMonitor
        embed: true
      - target: AradaShieldConfiguration
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arada.ios
        PRODUCT_NAME: Arada
        PRODUCT_MODULE_NAME: Arada
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/Arada.entitlements
    info:
      path: Supporting/Arada-Info.plist
      properties:
        CFBundleDisplayName: ARADA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  AradaDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitorExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arada.ios.device-activity-monitor
        PRODUCT_NAME: AradaDeviceActivityMonitor
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/DeviceActivityMonitor.entitlements
    info:
      path: Supporting/DeviceActivityMonitor-Info.plist
      properties:
        CFBundleDisplayName: ARADA Activity Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
  AradaShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arada.ios.shield-configuration
        PRODUCT_NAME: AradaShieldConfiguration
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/ShieldConfiguration.entitlements
    info:
      path: Supporting/ShieldConfiguration-Info.plist
      properties:
        CFBundleDisplayName: ARADA Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
  AradaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Arada
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arada.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Arada:
    build:
      targets:
        Arada: all
        AradaDeviceActivityMonitor: all
        AradaShieldConfiguration: all
        AradaTests: [test]
    test:
      targets:
        - AradaTests
