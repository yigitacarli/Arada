<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,300&display=swap">
  <style>
    body { margin: 0; }
    a { color: #221E17; } a:hover { color: #000000; }
    .disp { font-family: "Instrument Serif", ui-serif, Georgia, serif; }
    .text { font-family: "Newsreader", ui-serif, Georgia, serif; }
    .caps { letter-spacing: 0.2em; text-transform: uppercase; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #CBC4B7;">

  <!-- duvarın kendi tonu: köşelere doğru hafifçe kararıyor -->
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 80% at 62% 26%, #D6D0C4 0%, #C6BFB1 46%, #B2AB9D 100%);"></div>

  <!-- pencereden düşen ışık -->
  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 390px; height: 844px;">
    <defs>
      <filter id="soft-a" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="16"></feGaussianBlur>
      </filter>
      <filter id="soft-b" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="5"></feGaussianBlur>
      </filter>
      <linearGradient id="beam" x1="0.1" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="#FBF4E2" stop-opacity="0.94"></stop>
        <stop offset="0.62" stop-color="#F3E7CB" stop-opacity="0.72"></stop>
        <stop offset="1" stop-color="#E7D9BA" stop-opacity="0.30"></stop>
      </linearGradient>
    </defs>
    <polygon points="34,196 322,128 366,452 78,540" fill="url(#beam)" filter="url(#soft-a)"></polygon>
    <polygon points="176,166 190,163 226,494 212,497" fill="#A79D8B" opacity="0.30" filter="url(#soft-b)"></polygon>
    <polygon points="30,332 352,262 356,282 34,352" fill="#A79D8B" opacity="0.22" filter="url(#soft-b)"></polygon>
  </svg>

  <!-- sıva dokusu -->
  <svg style="position: absolute; inset: 0; width: 390px; height: 844px; opacity: 0.075; mix-blend-mode: multiply;">
    <filter id="grain-a">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="390" height="844" filter="url(#grain-a)"></rect>
  </svg>

  <!-- içerik -->
  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 62px 30px 40px; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 9px;">
      <svg viewBox="0 0 28 28" style="width: 17px; height: 17px; display: block;">
        <defs>
          <linearGradient id="mark-a" x1="0.05" y1="0" x2="0.85" y2="1">
            <stop offset="0.30" stop-color="#F8F1DE"></stop>
            <stop offset="0.62" stop-color="#221E17"></stop>
          </linearGradient>
        </defs>
        <rect x="0.6" y="0.6" width="26.8" height="26.8" fill="url(#mark-a)" stroke="#221E17" stroke-width="1.2"></rect>
      </svg>
      <div class="disp" style="font-size: 19px; letter-spacing: 0.05em; color: #221E17;">arada</div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 28px;">
      <div class="disp" style="font-size: 168px; line-height: 0.74; letter-spacing: -0.04em; color: #221E17;">2</div>
      <div class="text" style="font-size: 21px; font-weight: 300; font-style: italic; color: #3A342A; margin-top: 14px;">dakika hiçbir şey</div>
      <div class="text caps" style="font-size: 10px; font-weight: 400; color: #6E6555; margin-top: 20px;">Birinci hafta · Üçüncü gün</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 22px;">

      <div class="text" style="font-size: 16.5px; font-weight: 300; line-height: 1.62; color: #453E32; max-width: 29ch;">Telefonu yüzüstü çevir. Işık kendi kendine yürüyecek — bir şey yapman gerekmiyor.</div>

      <div class="text" style="background: #221E17; color: #F1EBDE; font-size: 16px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; text-align: center; padding: 19px 0; min-height: 56px; box-sizing: border-box;">Başla</div>

      <div style="display: flex; align-items: flex-end; gap: 7px; height: 26px; opacity: 0.85;">
        <div style="width: 100%; height: 9%; background: #221E17;"></div>
        <div style="width: 100%; height: 18%; background: #221E17; opacity: 0.16;"></div>
        <div style="width: 100%; height: 27%; background: #221E17; opacity: 0.16;"></div>
        <div style="width: 100%; height: 41%; background: #221E17; opacity: 0.16;"></div>
        <div style="width: 100%; height: 55%; background: #221E17; opacity: 0.16;"></div>
        <div style="width: 100%; height: 68%; background: #221E17; opacity: 0.16;"></div>
        <div style="width: 100%; height: 82%; background: #221E17; opacity: 0.16;"></div>
        <div style="width: 100%; height: 100%; background: #221E17; opacity: 0.16;"></div>
      </div>

      <div class="text caps" style="font-size: 9px; color: #6E6555; margin-top: -12px;">Sekiz hafta · iki dakikadan yirmi ikiye</div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
